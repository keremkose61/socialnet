  <text x="170" y="215" font-family="'Fira Code',Consolas,monospace" font-size="16" fill="#38BDF8">public static function <tspan fill="#4ADE80">query</tspan>(<tspan fill="#94A3B8">string $sql, array $p = []</tspan>): <tspan fill="#F43F5E">PDOStatement</tspan> {</text>

