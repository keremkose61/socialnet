<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1a"/>
      <stop offset="50%" stop-color="#121226"/>
      <stop offset="100%" stop-color="#09090f"/>
    </linearGradient>
    <linearGradient id="techGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="180" fill="#8B5CF6" opacity="0.25" filter="url(#blurGlow)"/>
  <circle cx="600" cy="320" r="160" fill="#22D3EE" opacity="0.2" filter="url(#blurGlow)"/>
  
  <!-- Geometric Grid -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Hologram Sphere Core -->
  <circle cx="400" cy="220" r="110" fill="none" stroke="url(#techGlow)" stroke-width="3" opacity="0.9"/>
  <ellipse cx="400" cy="220" rx="110" ry="38" fill="none" stroke="url(#techGlow)" stroke-width="2" opacity="0.7"/>
  <ellipse cx="400" cy="220" rx="38" ry="110" fill="none" stroke="url(#techGlow)" stroke-width="2" opacity="0.7"/>
  <circle cx="400" cy="220" r="28" fill="url(#techGlow)"/>

  <!-- Glass Card Overlay -->
  <rect x="60" y="360" width="680" height="95" rx="16" fill="rgba(18, 18, 28, 0.75)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
  <text x="90" y="405" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">NEXT-GEN UI / UX ARCHITECTURE</text>
  <text x="90" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#22D3EE">Linear, Threads &amp; Apple Inspired Design System</text>
</svg>