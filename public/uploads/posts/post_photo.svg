<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e112a"/>
      <stop offset="45%" stop-color="#4c1d4a"/>
      <stop offset="70%" stop-color="#be185d"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="350" fill="url(#skyGrad)"/>

  <!-- Giant Sun -->
  <circle cx="400" cy="240" r="95" fill="url(#sunGrad)"/>

  <!-- Mountain Silhouettes -->
  <polygon points="0,350 140,190 280,350" fill="#2d123b"/>
  <polygon points="180,350 360,160 520,350" fill="#1c0b25"/>
  <polygon points="440,350 580,210 740,350" fill="#2d123b"/>
  <polygon points="560,350 700,170 840,350" fill="#1c0b25"/>

  <!-- Lake Reflection -->
  <rect y="350" width="800" height="150" fill="#0d0514"/>
  <ellipse cx="400" cy="390" rx="90" ry="15" fill="#f59e0b" opacity="0.35"/>
  <ellipse cx="400" cy="420" rx="140" ry="10" fill="#be185d" opacity="0.25"/>

  <!-- Photography Watermark Badge -->
  <rect x="60" y="430" width="220" height="42" rx="10" fill="rgba(18,18,28,0.85)" stroke="rgba(255,255,255,0.15)"/>
  <text x="170" y="457" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">📷 35mm f/1.4 • ISO 100</text>
</svg>