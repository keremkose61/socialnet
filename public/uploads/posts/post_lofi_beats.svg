<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="tapeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090F"/>
      <stop offset="50%" stop-color="#1E1035"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="tapeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D124D"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#tapeBg)"/>
  <circle cx="400" cy="270" r="180" fill="#EC4899" opacity="0.15" filter="blur(60px)"/>

  <!-- Vintage Cassette Tape Model -->
  <g transform="translate(180, 100)">
    <!-- Tape Outer Shell -->
    <rect x="0" y="0" width="440" height="280" rx="24" fill="url(#tapeBody)" stroke="#7C3AED" stroke-width="3"/>
    
    <!-- Screws -->
    <circle cx="18" cy="18" r="4" fill="#9292A5"/>
    <circle cx="422" cy="18" r="4" fill="#9292A5"/>
    <circle cx="18" cy="262" r="4" fill="#9292A5"/>
    <circle cx="422" cy="262" r="4" fill="#9292A5"/>
    <circle cx="220" cy="18" r="4" fill="#9292A5"/>

    <!-- Tape Label Sticker -->
    <rect x="40" y="30" width="360" height="150" rx="12" fill="#F8FAFC"/>
    <rect x="55" y="44" width="330" height="18" rx="4" fill="#09090F"/>
    <text x="70" y="58" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="900" fill="#22D3EE">SIDE A · STEREO 90 MIN</text>
    <text x="365" y="58" font-family="monospace" font-size="11" font-weight="900" fill="#F43F5E">HQ-CHROME</text>
    
    <text x="65" y="85" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="20" font-weight="900" fill="#09090F">Midnight Lo-Fi Coding Beats</text>
    <text x="65" y="104" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="600" fill="#64748B">Chill Synthwave & Deep Focus Sessions</text>

    <!-- Clear Window -->
    <rect x="110" y="112" width="220" height="58" rx="8" fill="#12121C" stroke="#29293A" stroke-width="2"/>
    
    <!-- Left Reel -->
    <circle cx="160" cy="141" r="22" fill="#09090F" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="160" cy="141" r="9" fill="#F8FAFC"/>
    <!-- Right Reel -->
    <circle cx="280" cy="141" r="22" fill="#09090F" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="280" cy="141" r="9" fill="#F8FAFC"/>
    <!-- Connecting Tape Ribbon -->
    <line x1="160" y1="160" x2="280" y2="160" stroke="#7C3AED" stroke-width="4"/>

    <!-- Bottom Cutout Trap -->
    <polygon points="90,280 120,230 320,230 350,280" fill="#12121C" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="150" cy="255" r="8" fill="#2D124D"/>
    <circle cx="290" cy="255" r="8" fill="#2D124D"/>
  </g>

  <!-- Audio Equalizer Spectrum Waveform -->
  <g transform="translate(100, 440)">
    <!-- Equalizer Bars -->
    <g fill="url(#waveGrad)">
      <rect x="0" y="30" width="10" height="50" rx="5"/>
      <rect x="18" y="20" width="10" height="60" rx="5"/>
      <rect x="36" y="45" width="10" height="35" rx="5"/>
      <rect x="54" y="10" width="10" height="70" rx="5"/>
      <rect x="72" y="35" width="10" height="45" rx="5"/>
      <rect x="90" y="5" width="10" height="75" rx="5"/>
      <rect x="108" y="25" width="10" height="55" rx="5"/>
      <rect x="126" y="40" width="10" height="40" rx="5"/>
      <rect x="144" y="15" width="10" height="65" rx="5"/>
      <rect x="162" y="0" width="10" height="80" rx="5"/>
      <rect x="180" y="20" width="10" height="60" rx="5"/>
      <rect x="198" y="35" width="10" height="45" rx="5"/>
      <rect x="216" y="10" width="10" height="70" rx="5"/>
      <rect x="234" y="25" width="10" height="55" rx="5"/>
      <rect x="252" y="40" width="10" height="40" rx="5"/>
      <rect x="270" y="15" width="10" height="65" rx="5"/>
      <rect x="288" y="5" width="10" height="75" rx="5"/>
      <rect x="306" y="30" width="10" height="50" rx="5"/>
      <rect x="324" y="20" width="10" height="60" rx="5"/>
      <rect x="342" y="45" width="10" height="35" rx="5"/>
      <rect x="360" y="10" width="10" height="70" rx="5"/>
      <rect x="378" y="25" width="10" height="55" rx="5"/>
      <rect x="396" y="0" width="10" height="80" rx="5"/>
      <rect x="414" y="20" width="10" height="60" rx="5"/>
      <rect x="432" y="35" width="10" height="45" rx="5"/>
      <rect x="450" y="15" width="10" height="65" rx="5"/>
      <rect x="468" y="5" width="10" height="75" rx="5"/>
      <rect x="486" y="25" width="10" height="55" rx="5"/>
      <rect x="504" y="40" width="10" height="40" rx="5"/>
      <rect x="522" y="20" width="10" height="60" rx="5"/>
      <rect x="540" y="10" width="10" height="70" rx="5"/>
      <rect x="558" y="30" width="10" height="50" rx="5"/>
      <rect x="576" y="45" width="10" height="35" rx="5"/>
      <rect x="594" y="25" width="10" height="55" rx="5"/>
    </g>
    <!-- Music Player Info -->
    <text x="300" y="110" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="middle">3:42 / 48:15 · 24-bit Lossless FLAC</text>
  </g>
</svg>