<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090F"/>
      <stop offset="100%" stop-color="#191927"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#29293A"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mBg)"/>
  <circle cx="400" cy="300" r="240" fill="#8B5CF6" opacity="0.12" filter="blur(70px)"/>

  <!-- Left Side Text / Pitch -->
  <g transform="translate(60, 180)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="#8B5CF6"/>
    <text x="60" y="19" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="800" fill="#C084FC" text-anchor="middle">NATIVE APP</text>
    <text x="0" y="70" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" letter-spacing="-1">SocialNet Mobile</text>
    <text x="0" y="105" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="18" font-weight="600" fill="#22D3EE">Cebindeki Saf Güç.</text>
    <text x="0" y="145" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="400" fill="#9292A5" width="280">
      Akıcı mikro animasyonlar, dokunmatik hikaye geçişleri ve anlık WebRTC canlı yayın bildirimleri.
    </text>
    <rect x="0" y="180" width="150" height="42" rx="21" fill="linear-gradient(135deg, #8B5CF6, #22D3EE)"/>
    <text x="75" y="206" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Ön Kayıt Ol →</text>
  </g>

  <!-- Right Phone Mockup -->
  <g transform="translate(460, 40)">
    <!-- Phone Outer Shell -->
    <rect x="0" y="0" width="280" height="520" rx="44" fill="#09090F" stroke="url(#phoneBorder)" stroke-width="4"/>
    <!-- Screen -->
    <rect x="10" y="10" width="260" height="500" rx="36" fill="#12121C"/>
    <!-- Dynamic Island -->
    <rect x="90" y="20" width="80" height="20" rx="10" fill="#09090F"/>
    
    <!-- App Header -->
    <g transform="translate(24, 60)">
      <circle cx="12" cy="12" r="12" fill="#8B5CF6"/>
      <text x="32" y="17" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">SocialNet</text>
      <circle cx="218" cy="12" r="10" fill="#191927" stroke="#29293A"/>
    </g>

    <!-- Mini Stories -->
    <g transform="translate(20, 100)">
      <circle cx="24" cy="24" r="22" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="24" cy="24" r="19" fill="#191927"/>
      <text x="24" y="28" font-size="10" fill="#22D3EE" text-anchor="middle" font-weight="bold">+</text>

      <circle cx="78" cy="24" r="22" fill="none" stroke="#EC4899" stroke-width="2"/>
      <circle cx="78" cy="24" r="19" fill="#3B82F6"/>

      <circle cx="132" cy="24" r="22" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="132" cy="24" r="19" fill="#10B981"/>

      <circle cx="186" cy="24" r="22" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="186" cy="24" r="19" fill="#8B5CF6"/>
    </g>

    <!-- Mini Feed Card -->
    <g transform="translate(20, 165)">
      <rect x="0" y="0" width="220" height="230" rx="16" fill="#191927" stroke="#29293A"/>
      <!-- Header -->
      <circle cx="24" cy="24" r="12" fill="#7C3AED"/>
      <text x="44" y="24" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Kerem Köse</text>
      <text x="44" y="34" font-size="9" fill="#9292A5">@Kerem</text>
      <!-- Post Image -->
      <rect x="12" y="44" width="196" height="110" rx="10" fill="#09090F"/>
      <circle cx="110" cy="99" r="30" fill="#8B5CF6" opacity="0.4"/>
      <!-- Action row -->
      <g transform="translate(14, 168)">
        <text x="0" y="16" font-size="14" fill="#F43F5E">❤️</text>
        <text x="18" y="14" font-size="10" fill="#9292A5" font-weight="bold">142</text>
        <text x="50" y="16" font-size="14" fill="#9292A5">💬</text>
        <text x="68" y="14" font-size="10" fill="#9292A5" font-weight="bold">18</text>
        <text x="180" y="16" font-size="14" fill="#22D3EE">🔖</text>
      </g>
      <!-- Caption -->
      <text x="14" y="205" font-size="9.5" fill="#E2E8F0">Obsidian karanlık tema üzerinde...</text>
      <text x="14" y="218" font-size="9" fill="#22D3EE" font-weight="bold">#tasarim #socialnet</text>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(24, 455)">
      <rect x="0" y="0" width="212" height="36" rx="18" fill="#09090F" stroke="#29293A"/>
      <circle cx="30" cy="18" r="8" fill="#8B5CF6"/>
      <circle cx="82" cy="18" r="7" fill="#64748B"/>
      <circle cx="134" cy="18" r="7" fill="#64748B"/>
      <circle cx="182" cy="18" r="7" fill="#64748B"/>
    </g>
  </g>
</svg>