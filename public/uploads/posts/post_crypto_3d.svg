<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="orbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050A"/>
      <stop offset="100%" stop-color="#120E24"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="85%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#09090F"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#orbBg)"/>

  <!-- Ambient Glow Behind Orb -->
  <circle cx="400" cy="300" r="220" fill="#8B5CF6" opacity="0.25" filter="blur(80px)"/>
  <circle cx="480" cy="240" r="160" fill="#22D3EE" opacity="0.2" filter="blur(60px)"/>

  <!-- Floating 3D Geometric Rings Behind -->
  <ellipse cx="400" cy="300" rx="260" ry="80" fill="none" stroke="url(#ringGrad)" stroke-width="4" transform="rotate(-25 400 300)" opacity="0.7"/>

  <!-- 3D Glass Sphere -->
  <circle cx="400" cy="300" r="140" fill="url(#sphereGrad)"/>
  <circle cx="360" cy="240" r="50" fill="#FFFFFF" opacity="0.4" filter="blur(20px)"/>
  <circle cx="340" cy="220" r="20" fill="#FFFFFF" opacity="0.75" filter="blur(6px)"/>

  <!-- Floating 3D Geometric Rings In Front (cut) -->
  <path d="M165 410 Q400 480 635 190" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.9"/>

  <!-- Floating Satellites / Particles -->
  <circle cx="220" cy="180" r="14" fill="#22D3EE" opacity="0.8"/>
  <circle cx="600" cy="420" r="18" fill="#EC4899" opacity="0.7"/>
  <circle cx="280" cy="450" r="8" fill="#F8FAFC" opacity="0.5"/>
  <circle cx="560" cy="140" r="10" fill="#A78BFA" opacity="0.6"/>

  <!-- Overlay Typography -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="rgba(139, 92, 246, 0.2)" stroke="#8B5CF6"/>
    <text x="70" y="20" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="11.5" font-weight="800" fill="#A78BFA" text-anchor="middle">✦ 3D MOTION</text>
  </g>
  <text x="60" y="140" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Krom &amp; Cam Formlar</text>
  <text x="60" y="172" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="15" font-weight="500" fill="#22D3EE">Blender 4.2 Cycles render · Işık kırılımları ve kaustik hesaplama.</text>
</svg>