<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="swissBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090F"/>
      <stop offset="100%" stop-color="#191927"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#swissBg)"/>
  
  <!-- Geometric Swiss Grid -->
  <line x1="80" y1="40" x2="80" y2="560" stroke="#29293A" stroke-width="1"/>
  <line x1="280" y1="40" x2="280" y2="560" stroke="#29293A" stroke-width="1"/>
  <line x1="520" y1="40" x2="520" y2="560" stroke="#29293A" stroke-width="1"/>
  <line x1="720" y1="40" x2="720" y2="560" stroke="#29293A" stroke-width="1"/>

  <line x1="80" y1="80" x2="720" y2="80" stroke="#29293A" stroke-width="1"/>
  <line x1="80" y1="280" x2="720" y2="280" stroke="#29293A" stroke-width="1"/>
  <line x1="80" y1="480" x2="720" y2="480" stroke="#29293A" stroke-width="1"/>

  <!-- Giant Bold Number / Graphic -->
  <text x="500" y="240" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="160" font-weight="900" fill="#29293A" opacity="0.6">8.3</text>
  <circle cx="650" cy="180" r="40" fill="#8B5CF6"/>
  <rect x="520" y="320" width="160" height="120" fill="#22D3EE" opacity="0.85"/>

  <!-- Left Typographic Block -->
  <text x="100" y="70" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="12" font-weight="800" fill="#8B5CF6" letter-spacing="2">SWISS EDITORIAL NO. 04</text>
  <text x="100" y="140" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="54" font-weight="900" fill="#F8FAFC" letter-spacing="-2">Tipografi &amp;</text>
  <text x="100" y="200" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="54" font-weight="900" fill="#A78BFA" letter-spacing="-2">Saf Geometri</text>

  <text x="100" y="250" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="15" font-weight="500" fill="#9292A5" width="360">
    Gereksiz her detayın elendiği, saf font ağırlıkları ve dengeli negatif boşluklarla inşa edilen modern kullanıcı deneyimi.
  </text>

  <!-- Bottom Details -->
  <g transform="translate(100, 320)">
    <text x="0" y="20" font-family="monospace" font-size="12" fill="#22D3EE">KERNING: -0.04em</text>
    <text x="0" y="45" font-family="monospace" font-size="12" fill="#9292A5">LEADING: 1.15</text>
    <text x="0" y="70" font-family="monospace" font-size="12" fill="#9292A5">GRID: 12-COLUMN SUBDIV</text>
    <rect x="0" y="90" width="200" height="2" fill="#8B5CF6"/>
    <text x="0" y="115" font-family="-apple-system,BlinkMacSystemFont,'Inter',sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Zürih &amp; İstanbul Tasarım Manifestosu</text>
  </g>
</svg>